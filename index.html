<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOOVIT QR Management</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f2f2;
    color: #111;
}

header {
    background: #000;
    color: #fff;
    padding: 20px;
    text-align: center;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 2px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

h1, h2, h3 {
    margin-top: 0;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    margin-top: 6px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

label {
    font-weight: bold;
}

button {
    border: none;
    border-radius: 7px;
    padding: 13px 18px;
    font-size: 16px;
    cursor: pointer;
    margin: 4px;
}

.btn-primary {
    background: #ff6600;
    color: white;
}

.btn-dark {
    background: #000;
    color: white;
}

.btn-green {
    background: #168a35;
    color: white;
}

.btn-red {
    background: #c62828;
    color: white;
}

.btn-grey {
    background: #ddd;
    color: #111;
}

.hidden {
    display: none !important;
}

/* LOGIN */

.login-box {
    max-width: 450px;
    margin: 70px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.login-title {
    text-align: center;
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 25px;
}

/* DASHBOARD */

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.07);
}

.stat-number {
    font-size: 35px;
    font-weight: bold;
}

.stat-label {
    color: #666;
}

/* TABLE */

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #000;
    color: white;
}

.status-paid {
    color: green;
    font-weight: bold;
}

.status-due {
    color: #d68a00;
    font-weight: bold;
}

.status-overdue {
    color: red;
    font-weight: bold;
}

/* QR LABEL */

.label-wrapper {
    text-align: center;
}

.qr-label {
    width: 400px;
    max-width: 100%;
    margin: 20px auto;
    background: white;
    border: 4px solid #000;
    padding: 20px;
    text-align: left;
}

.qr-label h2 {
    text-align: center;
    font-size: 32px;
    margin: 0 0 20px;
}

.label-line {
    margin: 12px 0;
    font-size: 18px;
}

.label-line strong {
    display: block;
    margin-bottom: 3px;
}

#qrPreview {
    text-align: center;
    margin: 20px 0;
}

#qrPreview canvas,
#qrPreview img {
    max-width: 100%;
}

.scan-title {
    text-align: center;
    font-size: 30px;
    margin-bottom: 20px;
}

.scan-field {
    padding: 12px 0;
    border-bottom: 1px solid #ddd;
}

.scan-field strong {
    display: block;
    margin-bottom: 5px;
}

.scan-status {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    padding: 15px;
    margin: 15px 0;
    border-radius: 8px;
}

/* PRINT */

@media print {

    body * {
        visibility: hidden;
    }

    #labelArea,
    #labelArea * {
        visibility: visible;
    }

    #labelArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
    }

    .print-hide {
        display: none !important;
    }

    .qr-label {
        width: 90mm;
        margin: 0 auto;
        border: 2px solid #000;
        box-shadow: none;
    }
}

/* MOBILE */

@media (max-width: 700px) {

    .dashboard-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .container {
        padding: 10px;
    }

    .qr-label {
        width: 100%;
    }

    table {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MOOVIT</div>
</header>


<!-- ================= LOGIN ================= -->

<div id="loginScreen">

    <div class="login-box">

        <div class="login-title">
            MOOVIT
        </div>

        <p style="text-align:center;">
            Administration Login
        </p>

        <label>Password</label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter password"
        >

        <button
            class="btn-primary"
            style="width:100%;"
            onclick="login()"
        >
            Login
        </button>

        <p
            id="loginError"
            style="color:red;text-align:center;"
        ></p>

    </div>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminScreen" class="hidden">

    <div class="container">

        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">

            <div>
                <h1>MOOVIT Dashboard</h1>
                <p>QR Record Management System</p>
            </div>

            <button
                class="btn-dark"
                onclick="logout()"
            >
                Logout
            </button>

        </div>


        <!-- STATS -->

        <div class="dashboard-grid">

            <div class="stat">
                <div
                    class="stat-number"
                    id="recordCount"
                >0</div>

                <div class="stat-label">
                    Records
                </div>
            </div>


            <div class="stat">
                <div
                    class="stat-number"
                    id="paidCount"
                >0</div>

                <div class="stat-label">
                    Paid
                </div>
            </div>


            <div class="stat">
                <div
                    class="stat-number"
                    id="dueCount"
                >0</div>

                <div class="stat-label">
                    Due Soon
                </div>
            </div>


            <div class="stat">
                <div
                    class="stat-number"
                    id="overdueCount"
                >0</div>

                <div class="stat-label">
                    Overdue
                </div>
            </div>

        </div>


        <!-- CREATE RECORD -->

        <div class="card">

            <h2>Create Customer / Record</h2>

            <label>Customer Name</label>

            <input
                id="customer"
                placeholder="Customer name"
            >


            <label>Telephone</label>

            <input
                id="telephone"
                placeholder="Telephone"
            >


            <label>Email</label>

            <input
                id="email"
                type="email"
                placeholder="Email"
            >


            <label>Address</label>

            <textarea
                id="address"
                placeholder="Address"
            ></textarea>


            <label>Item / Box / Asset</label>

            <input
                id="item"
                placeholder="Item / contents / asset"
            >


            <label>Payment Amount (€)</label>

            <input
                id="amount"
                type="number"
                step="0.01"
                placeholder="0.00"
            >


            <label>Payment Due</label>

            <input
                id="dueDate"
                type="date"
            >


            <label>Payment Status</label>

            <select id="paymentStatus">

                <option value="Unpaid">
                    Unpaid
                </option>

                <option value="Paid">
                    Paid
                </option>

            </select>


            <label>Notes</label>

            <textarea
                id="notes"
                placeholder="Additional notes"
            ></textarea>


            <button
                class="btn-primary"
                onclick="createRecord()"
            >
                Create Record & Generate QR
            </button>

        </div>


        <!-- RECORDS -->

        <div class="card">

            <h2>Existing Records</h2>

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>Ref</th>
                            <th>Customer</th>
                            <th>Item</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="recordsTable"></tbody>

                </table>

            </div>

        </div>


        <!-- RESET -->

        <div class="card">

            <h3>Demo Controls</h3>

            <button
                class="btn-red"
                onclick="resetDemo()"
            >
                Reset Demo Data
            </button>

        </div>

    </div>

</div>


<!-- ================= QR LABEL ================= -->

<div id="qrScreen" class="hidden">

    <div class="container">

        <div class="card label-wrapper">

            <div id="labelArea">

                <div class="qr-label">

                    <h2>MOOVIT</h2>

                    <div class="label-line">
                        <strong>Customer:</strong>
                        <span id="labelCustomer"></span>
                    </div>

                    <div class="label-line">
                        <strong>Reference No.:</strong>
                        <span id="labelReference"></span>
                    </div>

                    <div class="label-line">
                        <strong>Item / Contents:</strong>
                        <span id="labelItem"></span>
                    </div>

                    <div
                        style="text-align:center;font-weight:bold;margin-top:20px;"
                    >
                        QR CODE
                    </div>

                    <div id="qrPreview"></div>

                </div>

            </div>


            <div class="print-hide">

                <button
                    class="btn-green"
                    onclick="downloadLabel(currentQRId)"
                >
                    💾 Save as Image
                </button>

                <button
                    class="btn-primary"
                    onclick="printLabel()"
                >
                    🖨 Print QR Label
                </button>

                <button
                    class="btn-dark"
                    onclick="showDashboard()"
                >
                    ← Back to Dashboard
                </button>

                <button
                    class="btn-grey"
                    onclick="testScan()"
                >
                    Test QR Scan
                </button>

            </div>

        </div>

    </div>

</div>


<!-- ================= SCAN VIEW ================= -->

<div id="scanScreen" class="hidden">

    <div class="container">

        <div class="card">

            <div class="scan-title">
                MOOVIT
            </div>

            <div id="scanContent"></div>

            <br>

            <button
                class="btn-dark"
                onclick="showDashboard()"
            >
                Back to Dashboard
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   SETTINGS
========================================= */

const ADMIN_PASSWORD = "admin123";

let records = [];

let currentQRId = null;


/* =========================================
   LOAD DATA
========================================= */

function loadRecords() {

    const saved =
        localStorage.getItem("moovitRecords");

    if (saved) {

        try {

            records = JSON.parse(saved);

        } catch (e) {

            records = [];

        }

    } else {

        records = [];

    }

}


/* =========================================
   SAVE DATA
========================================= */

function saveRecords() {

    localStorage.setItem(
        "moovitRecords",
        JSON.stringify(records)
    );

}


/* =========================================
   LOGIN
========================================= */

function login() {

    const password =
        document.getElementById("loginPassword").value;

    if (password === ADMIN_PASSWORD) {

        localStorage.setItem(
            "moovitLoggedIn",
            "true"
        );

        showDashboard();

    } else {

        document.getElementById("loginError").textContent =
            "Incorrect password.";

    }

}


/* =========================================
   LOGOUT
========================================= */

function logout() {

    localStorage.removeItem("moovitLoggedIn");

    document.getElementById("adminScreen")
        .classList.add("hidden");

    document.getElementById("qrScreen")
        .classList.add("hidden");

    document.getElementById("scanScreen")
        .classList.add("hidden");

    document.getElementById("loginScreen")
        .classList.remove("hidden");

}


/* =========================================
   DASHBOARD
========================================= */

function showDashboard() {

    document.getElementById("loginScreen")
        .classList.add("hidden");

    document.getElementById("qrScreen")
        .classList.add("hidden");

    document.getElementById("scanScreen")
        .classList.add("hidden");

    document.getElementById("adminScreen")
        .classList.remove("hidden");

    updateDashboard();

}


/* =========================================
   CREATE RECORD
========================================= */

function createRecord() {

    const customer =
        document.getElementById("customer").value.trim();

    const telephone =
        document.getElementById("telephone").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const address =
        document.getElementById("address").value.trim();

    const item =
        document.getElementById("item").value.trim();

    const amount =
        document.getElementById("amount").value;

    const dueDate =
        document.getElementById("dueDate").value;

    const paymentStatus =
        document.getElementById("paymentStatus").value;

    const notes =
        document.getElementById("notes").value.trim();


    if (!customer) {

        alert("Please enter a customer name.");

        return;

    }


    if (!item) {

        alert("Please enter the item / contents.");

        return;

    }


    const reference =
        String(records.length + 1).padStart(4, "0");


    const randomId =
        (
            window.crypto &&
            crypto.randomUUID
        )
        ?
        crypto.randomUUID()
        :
        Date.now().toString(36) +
        Math.random().toString(36).substring(2);


    const record = {

        id: randomId,

        reference: reference,

        customer: customer,

        telephone: telephone,

        email: email,

        address: address,

        item: item,

        amount: amount,

        dueDate: dueDate,

        paymentStatus: paymentStatus,

        notes: notes,

        created:
            new Date().toISOString()

    };


    records.push(record);

    saveRecords();

    clearForm();

    updateDashboard();

    showQR(randomId);

}


/* =========================================
   CLEAR FORM
========================================= */

function clearForm() {

    document.getElementById("customer").value = "";

    document.getElementById("telephone").value = "";

    document.getElementById("email").value = "";

    document.getElementById("address").value = "";

    document.getElementById("item").value = "";

    document.getElementById("amount").value = "";

    document.getElementById("dueDate").value = "";

    document.getElementById("paymentStatus").value =
        "Unpaid";

    document.getElementById("notes").value = "";

}


/* =========================================
   DASHBOARD COUNTS
========================================= */

function updateDashboard() {

    document.getElementById("recordCount").textContent =
        records.length;


    let paid = 0;
    let due = 0;
    let overdue = 0;


    records.forEach(record => {

        if (record.paymentStatus === "Paid") {

            paid++;

            return;

        }


        if (!record.dueDate) {

            return;

        }


        const today =
            new Date();

        today.setHours(0,0,0,0);


        const dueDate =
            new Date(record.dueDate);

        dueDate.setHours(0,0,0,0);


        const difference =
            (dueDate - today) /
            (1000 * 60 * 60 * 24);


        if (difference < 0) {

            overdue++;

        } else if (difference <= 7) {

            due++;

        }

    });


    document.getElementById("paidCount").textContent =
        paid;

    document.getElementById("dueCount").textContent =
        due;

    document.getElementById("overdueCount").textContent =
        overdue;


    renderRecords();

}


/* =========================================
   PAYMENT STATUS
========================================= */

function getPaymentDisplay(record) {

    if (record.paymentStatus === "Paid") {

        return `<span class="status-paid">PAID</span>`;

    }


    if (!record.dueDate) {

        return `<span>UNPAID</span>`;

    }


    const today =
        new Date();

    today.setHours(0,0,0,0);


    const dueDate =
        new Date(record.dueDate);

    dueDate.setHours(0,0,0,0);


    const difference =
        (dueDate - today) /
        (1000 * 60 * 60 * 24);


    if (difference < 0) {

        return `<span class="status-overdue">OVERDUE</span>`;

    }


    if (difference <= 7) {

        return `<span class="status-due">DUE SOON</span>`;

    }


    return `<span>UNPAID</span>`;

}


/* =========================================
   RECORD TABLE
========================================= */

function renderRecords() {

    const tbody =
        document.getElementById("recordsTable");

    tbody.innerHTML = "";


    records.forEach(record => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${record.reference}
            </td>

            <td>
                ${escapeHTML(record.customer)}
            </td>

            <td>
                ${escapeHTML(record.item)}
            </td>

            <td>
                ${getPaymentDisplay(record)}
            </td>

            <td>

                <button
                    class="btn-primary"
                    onclick="showQR('${record.id}')"
                >
                    QR
                </button>

            </td>

        `;


        tbody.appendChild(row);

    });

}


/* =========================================
   SHOW QR LABEL
========================================= */

function showQR(id) {

    const record =
        records.find(r => r.id === id);

    if (!record) return;


    currentQRId = id;


    document.getElementById("adminScreen")
        .classList.add("hidden");

    document.getElementById("scanScreen")
        .classList.add("hidden");

    document.getElementById("qrScreen")
        .classList.remove("hidden");


    document.getElementById("labelCustomer").textContent =
        record.customer || "";

    document.getElementById("labelReference").textContent =
        record.reference || "";

    document.getElementById("labelItem").textContent =
        record.item || "";


    const qrPreview =
        document.getElementById("qrPreview");

    qrPreview.innerHTML = "";


    const qrURL =
        window.location.origin +
        window.location.pathname +
        "?id=" +
        encodeURIComponent(record.id);


    new QRCode(qrPreview, {

        text: qrURL,

        width: 250,

        height: 250,

        correctLevel: QRCode.CorrectLevel.H

    });

}


/* =========================================
   SAVE LABEL AS JPEG
========================================= */

async function downloadLabel(id) {

    const record =
        records.find(r => r.id === id);

    if (!record) return;


    const canvas =
        document.createElement("canvas");

    canvas.width = 1000;
    canvas.height = 1200;


    const ctx =
        canvas.getContext("2d");


    /* WHITE BACKGROUND */

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* BORDER */

    ctx.strokeStyle = "#000000";

    ctx.lineWidth = 8;

    ctx.strokeRect(
        20,
        20,
        960,
        1160
    );


    /* MOOVIT */

    ctx.fillStyle = "#000000";

    ctx.textAlign = "center";

    ctx.font =
        "bold 70px Arial";

    ctx.fillText(
        "MOOVIT",
        500,
        110
    );


    /* CUSTOMER */

    ctx.textAlign = "left";

    ctx.font =
        "bold 38px Arial";

    ctx.fillText(
        "Customer:",
        70,
        200
    );


    ctx.font =
        "38px Arial";

    ctx.fillText(
        record.customer || "",
        70,
        250
    );


    /* REFERENCE */

    ctx.font =
        "bold 38px Arial";

    ctx.fillText(
        "Reference No.:",
        70,
        330
    );


    ctx.font =
        "38px Arial";

    ctx.fillText(
        record.reference || "",
        70,
        380
    );


    /* ITEM */

    ctx.font =
        "bold 38px Arial";

    ctx.fillText(
        "Item / Contents:",
        70,
        460
    );


    ctx.font =
        "34px Arial";


    const itemText =
        record.item || "";


    const words =
        itemText.split(" ");


    let line = "";

    let y = 510;


    for (let i = 0; i < words.length; i++) {

        const testLine =
            line +
            words[i] +
            " ";


        const width =
            ctx.measureText(testLine).width;


        if (width > 850) {

            ctx.fillText(
                line,
                70,
                y
            );

            line =
                words[i] +
                " ";

            y += 45;

        } else {

            line =
                testLine;

        }

    }


    ctx.fillText(
        line,
        70,
        y
    );


    /* QR CODE */

    const qrCanvas =
        document.querySelector(
            "#qrPreview canvas"
        );


    const qrImage =
        document.querySelector(
            "#qrPreview img"
        );


    const qrSize = 550;

    const qrX =
        (1000 - qrSize) / 2;

    const qrY = 570;


    if (qrCanvas) {

        ctx.drawImage(
            qrCanvas,
            qrX,
            qrY,
            qrSize,
            qrSize
        );

    } else if (qrImage) {

        ctx.drawImage(
            qrImage,
            qrX,
            qrY,
            qrSize,
            qrSize
        );

    } else {

        alert("QR code could not be found.");

        return;

    }


    /* SCAN TEXT */

    ctx.textAlign = "center";

    ctx.font =
        "bold 36px Arial";

    ctx.fillText(
        "SCAN TO IDENTIFY",
        500,
        1170
    );


    /* CREATE JPEG */

    canvas.toBlob(
        async function(blob) {

            if (!blob) {

                alert(
                    "Unable to create image."
                );

                return;

            }


            const filename =
                "MOOVIT_" +
                (record.reference || "Label") +
                "_QR_Label.jpg";


            const file =
                new File(
                    [blob],
                    filename,
                    {
                        type: "image/jpeg"
                    }
                );


            /*
             * iPHONE / iPAD / MODERN MOBILE
             *
             * Opens the normal sharing screen.
             * From there you can choose:
             * Save Image
             * Save to Files
             */

            if (
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({
                    files: [file]
                })
            ) {

                try {

                    await navigator.share({

                        files: [file],

                        title:
                            "MOOVIT QR Label",

                        text:
                            "MOOVIT QR Label"

                    });

                    return;

                } catch (error) {

                    if (
                        error.name ===
                        "AbortError"
                    ) {

                        return;

                    }

                }

            }


            /*
             * DESKTOP / BROWSER FALLBACK
             */

            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;

            link.download = filename;


            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);


            setTimeout(
                function() {

                    URL.revokeObjectURL(url);

                },
                1000
            );


        },
        "image/jpeg",
        0.95
    );

}


/* =========================================
   PRINT LABEL
========================================= */

function printLabel() {

    window.print();

}


/* =========================================
   TEST QR SCAN
========================================= */

function testScan() {

    if (!currentQRId) return;

    showScan(currentQRId);

}


/* =========================================
   SHOW SCAN RESULT
========================================= */

function showScan(id) {

    const record =
        records.find(r => r.id === id);


    if (!record) {

        showNotFound();

        return;

    }


    document.getElementById("loginScreen")
        .classList.add("hidden");

    document.getElementById("adminScreen")
        .classList.add("hidden");

    document.getElementById("qrScreen")
        .classList.add("hidden");

    document.getElementById("scanScreen")
        .classList.remove("hidden");


    let paymentHTML =
        getPaymentDisplay(record);


    let amountHTML = "";


    if (record.amount) {

        amountHTML =
            `<div class="scan-field">
                <strong>Payment Amount</strong>
                €${escapeHTML(record.amount)}
            </div>`;

    }


    document.getElementById("scanContent").innerHTML = `

        <div class="scan-status">
            ${paymentHTML}
        </div>

        <div class="scan-field">
            <strong>Reference</strong>
            ${escapeHTML(record.reference)}
        </div>

        <div class="scan-field">
            <strong>Customer</strong>
            ${escapeHTML(record.customer)}
        </div>

        <div class="scan-field">
            <strong>Item / Contents</strong>
            ${escapeHTML(record.item)}
        </div>

        <div class="scan-field">
            <strong>Address</strong>
            ${escapeHTML(record.address)}
        </div>

        <div class="scan-field">
            <strong>Telephone</strong>
            ${escapeHTML(record.telephone)}
        </div>

        <div class="scan-field">
            <strong>Email</strong>
            ${escapeHTML(record.email)}
        </div>

        ${amountHTML}

        <div class="scan-field">
            <strong>Payment Due</strong>
            ${escapeHTML(record.dueDate || "")}
        </div>

        <div class="scan-field">
            <strong>Notes</strong>
            ${escapeHTML(record.notes)}
        </div>

    `;

}


/* =========================================
   NOT FOUND
========================================= */

function showNotFound() {

    document.getElementById("loginScreen")
        .classList.add("hidden");

    document.getElementById("adminScreen")
        .classList.add("hidden");

    document.getElementById("qrScreen")
        .classList.add("hidden");

    document.getElementById("scanScreen")
        .classList.remove("hidden");


    document.getElementById("scanContent").innerHTML = `

        <div style="text-align:center;padding:40px;">

            <h2>Record Not Found</h2>

            <p>
                This QR code does not match
                a MOOVIT record.
            </p>

        </div>

    `;

}


/* =========================================
   RESET DEMO
========================================= */

function resetDemo() {

    const first =
        confirm(
            "WARNING: This will delete all MOOVIT demo records. Continue?"
        );


    if (!first) return;


    const second =
        confirm(
            "FINAL WARNING: All existing demo data will be permanently removed from this browser. Are you sure?"
        );


    if (!second) return;


    records = [];

    localStorage.removeItem(
        "moovitRecords"
    );


    updateDashboard();

    alert(
        "MOOVIT demo data has been reset."
    );

}


/* =========================================
   HTML SECURITY
========================================= */

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================
   STARTUP
========================================= */

loadRecords();


/*
 * If URL contains ?id=...
 * show the record directly.
 *
 * This means QR scanning does NOT
 * require admin login.
 */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const scannedId =
    urlParams.get("id");


if (scannedId) {

    showScan(scannedId);

} else if (
    localStorage.getItem(
        "moovitLoggedIn"
    ) === "true"
) {

    showDashboard();

} else {

    document.getElementById("loginScreen")
        .classList.remove("hidden");

}

</script>
