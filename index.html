<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOOVIT</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f2f2;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
}

.header-right {
    font-size: 14px;
    opacity: .8;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

h1, h2, h3 {
    margin-top: 0;
}

.login {
    max-width: 420px;
    margin: 80px auto;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

label {
    font-weight: bold;
    display: block;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 12px 18px;
    background: #111;
    color: white;
    cursor: pointer;
    font-size: 15px;
    margin: 4px;
}

button:hover {
    opacity: .85;
}

button.secondary {
    background: #666;
}

button.danger {
    background: #b00020;
}

button.green {
    background: #287a35;
}

button.orange {
    background: #d87900;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 7px rgba(0,0,0,.07);
}

.stat-number {
    font-size: 30px;
    font-weight: bold;
    margin-top: 5px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.record {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 10px;
    background: #fafafa;
}

.status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: bold;
}

.paid {
    background: #d9f2dc;
    color: #176522;
}

.due {
    background: #fff0c9;
    color: #8a5b00;
}

.overdue {
    background: #ffd9d9;
    color: #9b0000;
}

.unpaid {
    background: #eee;
    color: #555;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 850px;
}

th,
td {
    border-bottom: 1px solid #ddd;
    padding: 10px;
    text-align: left;
}

th {
    background: #eee;
}

.hidden {
    display: none !important;
}

.qr-area {
    text-align: center;
}

.label-preview {
    width: 400px;
    max-width: 100%;
    margin: auto;
    padding: 25px;
    border: 2px solid #111;
    background: white;
    text-align: center;
}

.label-preview h1 {
    font-size: 34px;
    margin-bottom: 15px;
}

.label-info {
    text-align: left;
    font-size: 16px;
    margin-top: 15px;
}

.label-info div {
    margin: 8px 0;
}

.scan-result {
    max-width: 700px;
    margin: 50px auto;
}

.scan-row {
    padding: 12px 0;
    border-bottom: 1px solid #ddd;
}

.scan-row strong {
    display: inline-block;
    width: 180px;
}

@media(max-width: 800px) {

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    header {
        padding: 15px;
    }

    .container {
        padding: 15px;
    }
}

@media(max-width: 500px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .login {
        margin: 30px auto;
    }

    button {
        width: 100%;
        margin: 4px 0;
    }
}

@media print {

    body * {
        visibility: hidden;
    }

    #printArea,
    #printArea * {
        visibility: visible;
    }

    #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
    }

    .print-label {
        page-break-after: always;
        width: 100%;
        text-align: center;
        padding: 30px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MOOVIT</div>
    <div class="header-right" id="headerText"></div>
</header>

<div class="container">

<!-- LOGIN -->

<div id="loginScreen" class="card login">

    <h2>MOOVIT Admin</h2>

    <p>Enter administrator password.</p>

    <label>Password</label>
    <input type="password" id="password">

    <button onclick="login()">Login</button>

    <p id="loginError" style="color:red;"></p>

</div>


<!-- ADMIN -->

<div id="adminScreen" class="hidden">

    <h1>MOOVIT Admin</h1>

    <div class="stats">

        <div class="stat">
            <div>Records</div>
            <div class="stat-number" id="statRecords">0</div>
        </div>

        <div class="stat">
            <div>Paid</div>
            <div class="stat-number" id="statPaid">0</div>
        </div>

        <div class="stat">
            <div>Due Soon</div>
            <div class="stat-number" id="statDue">0</div>
        </div>

        <div class="stat">
            <div>Overdue</div>
            <div class="stat-number" id="statOverdue">0</div>
        </div>

    </div>


    <!-- CREATE RECORD -->

    <div class="card">

        <h2 id="formTitle">Create Record</h2>

        <input type="hidden" id="editingId">

        <div class="grid">

            <div>

                <label>Customer Name</label>
                <input id="customer">

                <label>Telephone</label>
                <input id="telephone">

                <label>Email</label>
                <input id="email">

                <label>Address</label>
                <textarea id="address"></textarea>

            </div>

            <div>

                <label>Item / Box / Asset / Contents</label>
                <input id="item">

                <label>Number of Boxes</label>
                <input id="boxCount" type="number" min="1" value="1">

                <label>Payment Amount (€)</label>
                <input id="amount" type="number" step="0.01">

                <label>Payment Due / Expiry</label>
                <input id="dueDate" type="date">

                <label>Payment Status</label>
                <select id="paymentStatus">
                    <option value="Unpaid">Unpaid</option>
                    <option value="Paid">Paid</option>
                </select>

            </div>

        </div>

        <label>Notes</label>
        <textarea id="notes"></textarea>

        <button class="green" onclick="saveRecord()">Save Record</button>
        <button class="secondary" onclick="clearForm()">Clear</button>

    </div>


    <!-- RECORDS -->

    <div class="card">

        <h2>Records</h2>

        <input
            id="search"
            placeholder="Search customer, reference, item..."
            oninput="displayRecords()"
        >

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Reference</th>
                        <th>Customer</th>
                        <th>Item</th>
                        <th>Boxes</th>
                        <th>Payment</th>
                        <th>Expiry</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="recordsTable"></tbody>

            </table>

        </div>

    </div>


    <!-- QR LABEL -->

    <div id="qrSection" class="card hidden">

        <h2>QR Label</h2>

        <div class="qr-area">

            <div class="label-preview" id="labelPreview">

                <h1>MOOVIT</h1>

                <div id="labelCustomer"></div>

                <div id="labelReference"></div>

                <div id="labelBox"></div>

                <div id="labelItem"></div>

                <div id="qrcode"></div>

                <p><strong>SCAN TO IDENTIFY</strong></p>

            </div>

            <br>

            <label>Select Box</label>

            <select id="boxSelector" onchange="changeBox()"></select>

            <br>

            <button onclick="printCurrentLabel()">Print Current Label</button>

            <button onclick="printAllLabels()">Print All Labels</button>

            <button class="secondary" onclick="closeQR()">Close</button>

        </div>

    </div>


    <!-- RESET -->

    <div class="card">

        <h2>Demo Controls</h2>

        <button class="danger" onclick="resetDemo()">Reset Demo Data</button>

        <button class="secondary" onclick="logout()">Logout</button>

    </div>

</div>


<!-- PUBLIC SCAN RESULT -->

<div id="scanScreen" class="hidden">

    <div class="card scan-result">

        <h1 style="text-align:center;">MOOVIT</h1>

        <h2 style="text-align:center;">Storage Information</h2>

        <div id="scanContent"></div>

    </div>

</div>

</div>


<!-- PRINT AREA -->

<div id="printArea"></div>


<script>

/* ============================
   SETTINGS
============================ */

const ADMIN_PASSWORD = "admin123";

const STORAGE_KEY = "moovit_records";


/* ============================
   STORAGE
============================ */

function getRecords() {

    try {

        return JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        ) || [];

    } catch {

        return [];

    }

}


function saveRecords(records) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(records)
    );

}


/* ============================
   LOGIN
============================ */

function login() {

    const password =
        document.getElementById("password").value;

    if(password === ADMIN_PASSWORD) {

        sessionStorage.setItem(
            "moovit_admin",
            "true"
        );

        showAdmin();

    } else {

        document.getElementById(
            "loginError"
        ).textContent =
            "Incorrect password.";

    }

}


function logout() {

    sessionStorage.removeItem(
        "moovit_admin"
    );

    location.reload();

}


/* ============================
   STARTUP
============================ */

window.onload = function() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const data = params.get("data");

    if(data) {

        showPublicScan(data);

        return;

    }

    if(
        sessionStorage.getItem(
            "moovit_admin"
        ) === "true"
    ) {

        showAdmin();

    } else {

        showLogin();

    }

};


function showLogin() {

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    document
        .getElementById("adminScreen")
        .classList.add("hidden");

    document
        .getElementById("scanScreen")
        .classList.add("hidden");

    document.getElementById(
        "headerText"
    ).textContent = "";

}


function showAdmin() {

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("scanScreen")
        .classList.add("hidden");

    document
        .getElementById("adminScreen")
        .classList.remove("hidden");

    document.getElementById(
        "headerText"
    ).textContent = "ADMIN";

    updateDashboard();

    displayRecords();

}


/* ============================
   REFERENCE NUMBERS
============================ */

function getNextReference() {

    const records = getRecords();

    let highest = 0;

    records.forEach(record => {

        const number =
            parseInt(record.reference);

        if(!isNaN(number) && number > highest) {

            highest = number;

        }

    });

    return String(
        highest + 1
    ).padStart(4, "0");

}


/* ============================
   SAVE RECORD
============================ */

function saveRecord() {

    const customer =
        document.getElementById("customer").value.trim();

    if(!customer) {

        alert("Please enter the customer name.");

        return;

    }

    const editingId =
        document.getElementById("editingId").value;

    const records = getRecords();

    const record = {

        id:
            editingId ||
            crypto.randomUUID(),

        reference:
            editingId
                ? records.find(r => r.id === editingId).reference
                : getNextReference(),

        customer,

        telephone:
            document.getElementById("telephone").value.trim(),

        email:
            document.getElementById("email").value.trim(),

        address:
            document.getElementById("address").value.trim(),

        item:
            document.getElementById("item").value.trim(),

        boxCount:
            Math.max(
                1,
                parseInt(
                    document.getElementById("boxCount").value
                ) || 1
            ),

        amount:
            document.getElementById("amount").value,

        dueDate:
            document.getElementById("dueDate").value,

        paymentStatus:
            document.getElementById("paymentStatus").value,

        notes:
            document.getElementById("notes").value.trim(),

        created:
            editingId
                ? records.find(r => r.id === editingId).created
                : new Date().toISOString()

    };


    if(editingId) {

        const index =
            records.findIndex(
                r => r.id === editingId
            );

        records[index] = record;

    } else {

        records.push(record);

    }


    saveRecords(records);

    alert(
        editingId
            ? "Record updated."
            : "Record created."
    );

    clearForm();

    updateDashboard();

    displayRecords();

}


/* ============================
   CLEAR FORM
============================ */

function clearForm() {

    document.getElementById(
        "editingId"
    ).value = "";

    document.getElementById(
        "formTitle"
    ).textContent = "Create Record";

    document.getElementById(
        "customer"
    ).value = "";

    document.getElementById(
        "telephone"
    ).value = "";

    document.getElementById(
        "email"
    ).value = "";

    document.getElementById(
        "address"
    ).value = "";

    document.getElementById(
        "item"
    ).value = "";

    document.getElementById(
        "boxCount"
    ).value = 1;

    document.getElementById(
        "amount"
    ).value = "";

    document.getElementById(
        "dueDate"
    ).value = "";

    document.getElementById(
        "paymentStatus"
    ).value = "Unpaid";

    document.getElementById(
        "notes"
    ).value = "";

}


/* ============================
   EDIT
============================ */

function editRecord(id) {

    const record =
        getRecords().find(
            r => r.id === id
        );

    if(!record) return;

    document.getElementById(
        "editingId"
    ).value = record.id;

    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Record " +
        record.reference;

    document.getElementById(
        "customer"
    ).value = record.customer || "";

    document.getElementById(
        "telephone"
    ).value = record.telephone || "";

    document.getElementById(
        "email"
    ).value = record.email || "";

    document.getElementById(
        "address"
    ).value = record.address || "";

    document.getElementById(
        "item"
    ).value = record.item || "";

    document.getElementById(
        "boxCount"
    ).value = record.boxCount || 1;

    document.getElementById(
        "amount"
    ).value = record.amount || "";

    document.getElementById(
        "dueDate"
    ).value = record.dueDate || "";

    document.getElementById(
        "paymentStatus"
    ).value =
        record.paymentStatus || "Unpaid";

    document.getElementById(
        "notes"
    ).value = record.notes || "";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ============================
   DELETE
============================ */

function deleteRecord(id) {

    if(
        !confirm(
            "Delete this record?"
        )
    ) return;

    let records = getRecords();

    records =
        records.filter(
            r => r.id !== id
        );

    saveRecords(records);

    updateDashboard();

    displayRecords();

}


/* ============================
   PAYMENT STATUS
============================ */

function getStatus(record) {

    if(record.paymentStatus === "Paid") {

        return "Paid";

    }

    if(!record.dueDate) {

        return "Unpaid";

    }

    const today =
        new Date();

    today.setHours(
        0,0,0,0
    );

    const due =
        new Date(
            record.dueDate
        );

    due.setHours(
        0,0,0,0
    );

    const difference =
        (due - today) /
        (1000 * 60 * 60 * 24);

    if(difference < 0) {

        return "Overdue";

    }

    if(difference <= 30) {

        return "Due Soon";

    }

    return "Unpaid";

}


/* ============================
   DASHBOARD
============================ */

function updateDashboard() {

    const records =
        getRecords();

    let paid = 0;
    let due = 0;
    let overdue = 0;

    records.forEach(record => {

        const status =
            getStatus(record);

        if(status === "Paid") paid++;

        if(status === "Due Soon") due++;

        if(status === "Overdue") overdue++;

    });

    document.getElementById(
        "statRecords"
    ).textContent =
        records.length;

    document.getElementById(
        "statPaid"
    ).textContent =
        paid;

    document.getElementById(
        "statDue"
    ).textContent =
        due;

    document.getElementById(
        "statOverdue"
    ).textContent =
        overdue;

}


/* ============================
   DISPLAY RECORDS
============================ */

function displayRecords() {

    const records =
        getRecords();

    const search =
        document.getElementById(
            "search"
        ).value.toLowerCase();

    const table =
        document.getElementById(
            "recordsTable"
        );

    table.innerHTML = "";


    records
        .filter(record => {

            const text =
                (
                    record.reference +
                    " " +
                    record.customer +
                    " " +
                    record.item +
                    " " +
                    record.telephone
                ).toLowerCase();

            return text.includes(search);

        })
        .forEach(record => {

            const status =
                getStatus(record);

            let statusClass =
                status.toLowerCase()
                    .replace(" ", "");

            const row =
                document.createElement("tr");

            row.innerHTML = `

                <td>
                    <strong>
                        ${escapeHTML(record.reference)}
                    </strong>
                </td>

                <td>
                    ${escapeHTML(record.customer)}
                </td>

                <td>
                    ${escapeHTML(record.item || "")}
                </td>

                <td>
                    ${record.boxCount}
                </td>

                <td>
                    <span class="status ${statusClass}">
                        ${status}
                    </span>
                </td>

                <td>
                    ${record.dueDate || "-"}
                </td>

                <td>

                    <button
                        onclick="showQR('${record.id}')">
                        QR
                    </button>

                    <button
                        class="secondary"
                        onclick="editRecord('${record.id}')">
                        Edit
                    </button>

                    <button
                        class="danger"
                        onclick="deleteRecord('${record.id}')">
                        Delete
                    </button>

                </td>

            `;

            table.appendChild(row);

        });

}


/* ============================
   QR DATA
============================ */

function encodeQRData(record, boxNumber) {

    const data = {

        id: record.id,

        reference: record.reference,

        customer: record.customer,

        telephone: record.telephone,

        email: record.email,

        address: record.address,

        item: record.item,

        boxNumber,

        boxCount: record.boxCount,

        amount: record.amount,

        dueDate: record.dueDate,

        paymentStatus: record.paymentStatus,

        notes: record.notes

    };


    const json =
        JSON.stringify(data);

    const bytes =
        new TextEncoder()
            .encode(json);

    let binary = "";

    bytes.forEach(
        b => binary +=
            String.fromCharCode(b)
    );

    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");

}


/* ============================
   QR URL
============================ */

function getQRUrl(record, boxNumber) {

    const encoded =
        encodeQRData(
            record,
            boxNumber
        );

    return (
        window.location.origin +
        window.location.pathname +
        "?data=" +
        encoded
    );

}


/* ============================
   SHOW QR
============================ */

let currentQRRecord = null;
let currentBox = 1;


function showQR(id) {

    const record =
        getRecords().find(
            r => r.id === id
        );

    if(!record) return;

    currentQRRecord = record;

    currentBox = 1;

    const selector =
        document.getElementById(
            "boxSelector"
        );

    selector.innerHTML = "";

    for(
        let i = 1;
        i <= record.boxCount;
        i++
    ) {

        const option =
            document.createElement("option");

        option.value = i;

        option.textContent =
            "Box " +
            i +
            " of " +
            record.boxCount;

        selector.appendChild(
            option
        );

    }

    document
        .getElementById("qrSection")
        .classList.remove("hidden");

    renderQR();

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

}


function changeBox() {

    currentBox =
        parseInt(
            document.getElementById(
                "boxSelector"
            ).value
        );

    renderQR();

}


function renderQR() {

    const record =
        currentQRRecord;

    document.getElementById(
        "labelCustomer"
    ).innerHTML =
        "<strong>Customer:</strong> " +
        escapeHTML(record.customer);

    document.getElementById(
        "labelReference"
    ).innerHTML =
        "<strong>Reference No.:</strong> " +
        escapeHTML(record.reference);

    document.getElementById(
        "labelBox"
    ).innerHTML =
        "<strong>Box " +
        currentBox +
        " of " +
        record.boxCount +
        "</strong>";

    document.getElementById(
        "labelItem"
    ).innerHTML =
        "<strong>Item / Contents:</strong><br>" +
        escapeHTML(record.item || "");

    const qr =
        document.getElementById(
            "qrcode"
        );

    qr.innerHTML = "";

    new QRCode(qr, {

        text:
            getQRUrl(
                record,
                currentBox
            ),

        width: 220,

        height: 220,

        correctLevel:
            QRCode.CorrectLevel.H

    });

}


/* ============================
   PRINT CURRENT
============================ */

function printCurrentLabel() {

    const record =
        currentQRRecord;

    const url =
        getQRUrl(
            record,
            currentBox
        );

    document.getElementById(
        "printArea"
    ).innerHTML = createPrintLabel(
        record,
        currentBox,
        url
    );

    window.print();

}


/* ============================
   PRINT ALL
============================ */

function printAllLabels() {

    const record =
        currentQRRecord;

    let html = "";

    for(
        let i = 1;
        i <= record.boxCount;
        i++
    ) {

        html += createPrintLabel(
            record,
            i,
            getQRUrl(
                record,
                i
            )
        );

    }

    document.getElementById(
        "printArea"
    ).innerHTML = html;

    window.print();

}


function createPrintLabel(
    record,
    boxNumber,
    url
) {

    const id =
        "qr_" +
        boxNumber +
        "_" +
        Math.random()
            .toString(36)
            .substring(2);

    setTimeout(() => {

        new QRCode(
            document.getElementById(id),
            {

                text: url,

                width: 250,

                height: 250,

                correctLevel:
                    QRCode.CorrectLevel.H

            }
        );

    }, 50);


    return `

        <div class="print-label">

            <h1>MOOVIT</h1>

            <h2>
                Customer:
                ${escapeHTML(record.customer)}
            </h2>

            <h2>
                Reference No.:
                ${escapeHTML(record.reference)}
            </h2>

            <h2>
                Box ${boxNumber}
                of
                ${record.boxCount}
            </h2>

            <p>
                <strong>
                    Item / Contents
                </strong>
            </p>

            <p>
                ${escapeHTML(record.item || "")}
            </p>

            <div id="${id}"></div>

            <h3>
                SCAN TO IDENTIFY
            </h3>

        </div>

    `;

}


/* ============================
   CLOSE QR
============================ */

function closeQR() {

    document
        .getElementById("qrSection")
        .classList.add("hidden");

}


/* ============================
   PUBLIC SCAN
============================ */

function showPublicScan(encoded) {

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("adminScreen")
        .classList.add("hidden");

    document
        .getElementById("scanScreen")
        .classList.remove("hidden");

    document.getElementById(
        "headerText"
    ).textContent =
        "STORAGE INFORMATION";


    try {

        let base64 =
            encoded
                .replace(/-/g, "+")
                .replace(/_/g, "/");

        while(
            base64.length % 4
        ) {

            base64 += "=";

        }

        const binary =
            atob(base64);

        const bytes =
            Uint8Array.from(
                binary,
                c => c.charCodeAt(0)
            );

        const json =
            new TextDecoder()
                .decode(bytes);

        const data =
            JSON.parse(json);

        displayScanData(data);

    } catch(error) {

        document.getElementById(
            "scanContent"
        ).innerHTML = `

            <h2 style="color:red;">
                Invalid QR Code
            </h2>

            <p>
                The QR code could not be read.
            </p>

        `;

    }

}


function displayScanData(data) {

    const status =
        getPublicStatus(
            data
        );

    document.getElementById(
        "scanContent"
    ).innerHTML = `

        <div style="text-align:center;margin-bottom:25px;">

            <span class="status ${status.className}">
                ${status.text}
            </span>

        </div>

        <div class="scan-row">
            <strong>Reference:</strong>
            ${escapeHTML(data.reference)}
        </div>

        <div class="scan-row">
            <strong>Customer:</strong>
            ${escapeHTML(data.customer)}
        </div>

        <div class="scan-row">
            <strong>Box:</strong>
            ${data.boxNumber}
            of
            ${data.boxCount}
        </div>

        <div class="scan-row">
            <strong>Item / Contents:</strong>
            ${escapeHTML(data.item || "")}
        </div>

        <div class="scan-row">
            <strong>Address:</strong>
            ${escapeHTML(data.address || "")}
        </div>

        <div class="scan-row">
            <strong>Telephone:</strong>
            ${escapeHTML(data.telephone || "")}
        </div>

        <div class="scan-row">
            <strong>Email:</strong>
            ${escapeHTML(data.email || "")}
        </div>

        <div class="scan-row">
            <strong>Payment:</strong>
            €${escapeHTML(
                data.amount || "0.00"
            )}
        </div>

        <div class="scan-row">
            <strong>Expiry:</strong>
            ${escapeHTML(
                data.dueDate || "-"
            )}
        </div>

        <div class="scan-row">
            <strong>Notes:</strong>
            ${escapeHTML(
                data.notes || ""
            )}
        </div>

    `;

}


function getPublicStatus(data) {

    if(data.paymentStatus === "Paid") {

        return {
            text: "PAID",
            className: "paid"
        };

    }

    if(!data.dueDate) {

        return {
            text: "UNPAID",
            className: "unpaid"
        };

    }

    const today =
        new Date();

    today.setHours(
        0,0,0,0
    );

    const due =
        new Date(
            data.dueDate
        );

    due.setHours(
        0,0,0,0
    );

    const days =
        (due - today) /
        (1000 * 60 * 60 * 24);

    if(days < 0) {

        return {
            text: "OVERDUE",
            className: "overdue"
        };

    }

    if(days <= 30) {

        return {
            text: "DUE SOON",
            className: "due"
        };

    }

    return {
        text: "UNPAID",
        className: "unpaid"
    };

}


/* ============================
   RESET
============================ */

function resetDemo() {

    const first =
        confirm(
            "WARNING: This will delete all MOOVIT demo records. Continue?"
        );

    if(!first) return;

    const second =
        confirm(
            "FINAL WARNING: All records will be permanently removed from this browser."
        );

    if(!second) return;

    localStorage.removeItem(
        STORAGE_KEY
    );

    clearForm();

    updateDashboard();

    displayRecords();

    alert(
        "Demo data has been reset."
    );

}


/* ============================
   SECURITY
============================ */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
