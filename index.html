<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f2f2;
    color: #111;
}

header {
    background: #000;
    color: #fff;
    padding: 20px;
    text-align: center;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 3px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h1,
h2,
h3 {
    margin-top: 0;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    margin-top: 6px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

label {
    font-weight: bold;
}

button {
    border: none;
    border-radius: 7px;
    padding: 13px 18px;
    font-size: 16px;
    cursor: pointer;
    margin: 4px;
}

.btn-orange {
    background: #ff6600;
    color: #fff;
}

.btn-black {
    background: #000;
    color: #fff;
}

.btn-green {
    background: #168a35;
    color: #fff;
}

.btn-red {
    background: #c62828;
    color: #fff;
}

.btn-grey {
    background: #ddd;
    color: #111;
}

.hidden {
    display: none !important;
}


/* LOGIN */

.login-box {
    max-width: 450px;
    margin: 70px auto;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

.login-title {
    text-align: center;
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 25px;
}


/* DASHBOARD */

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,.07);
}

.stat-number {
    font-size: 35px;
    font-weight: bold;
}

.stat-label {
    color: #666;
}


/* TABLE */

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #000;
    color: #fff;
}


/* LABEL */

.label-area {
    text-align: center;
}

.qr-label {
    width: 400px;
    max-width: 100%;
    margin: 20px auto;
    background: #fff;
    border: 4px solid #000;
    padding: 20px;
    text-align: left;
}

.qr-label h2 {
    text-align: center;
    font-size: 32px;
    margin: 0 0 20px;
}

.label-line {
    margin: 12px 0;
    font-size: 18px;
}

.label-line strong {
    display: block;
    margin-bottom: 3px;
}

.box-number {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    margin: 15px 0;
}

.qr-code {
    text-align: center;
    margin: 15px 0;
}

.qr-code img,
.qr-code canvas {
    max-width: 100%;
}


/* BOX SELECTOR */

.box-selector {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
    margin: 15px 0;
}

.box-selector button {
    padding: 9px 12px;
    font-size: 14px;
}


/* SCAN */

.scan-title {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 20px;
}

.scan-box {
    border: 3px solid #000;
    border-radius: 10px;
    padding: 20px;
}

.scan-field {
    padding: 13px 0;
    border-bottom: 1px solid #ddd;
    font-size: 17px;
}

.scan-field strong {
    display: block;
    margin-bottom: 4px;
}

.scan-status {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
}


/* PRINT */

@media print {

    body * {
        visibility: hidden;
    }

    #printArea,
    #printArea * {
        visibility: visible;
    }

    #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
    }

    .print-hide {
        display: none !important;
    }

    .qr-label {
        page-break-after: always;
        width: 90mm;
        margin: 0 auto;
        border: 2px solid #000;
    }
}


/* MOBILE */

@media (max-width: 700px) {

    .dashboard-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .container {
        padding: 10px;
    }

    .qr-label {
        width: 100%;
    }

    table {
        font-size: 14px;
    }

}

</style>
</head>

<script>


/* =====================================================
   SETTINGS
===================================================== */

const ADMIN_PASSWORD = "admin123";

let records = [];

let currentRecordId = null;

let currentBoxNumber = 1;



/* =====================================================
   LOAD RECORDS
===================================================== */

function loadRecords() {

    const saved =
        localStorage.getItem("moovitRecords");

    if (!saved) {

        records = [];

        return;

    }

    try {

        records =
            JSON.parse(saved);

    } catch (error) {

        records = [];

    }

}



/* =====================================================
   SAVE RECORDS
===================================================== */

function saveRecords() {

    localStorage.setItem(
        "moovitRecords",
        JSON.stringify(records)
    );

}



/* =====================================================
   LOGIN
===================================================== */

function login() {

    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    if (
        password ===
        ADMIN_PASSWORD
    ) {

        localStorage.setItem(
            "moovitLoggedIn",
            "true"
        );

        showDashboard();

    } else {

        document.getElementById(
            "loginError"
        ).textContent =
            "Incorrect password.";

    }

}



/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem(
        "moovitLoggedIn"
    );

    document.getElementById(
        "adminScreen"
    ).classList.add("hidden");

    document.getElementById(
        "qrScreen"
    ).classList.add("hidden");

    document.getElementById(
        "scanScreen"
    ).classList.add("hidden");

    document.getElementById(
        "loginScreen"
    ).classList.remove("hidden");

}



/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard() {

    document.getElementById(
        "loginScreen"
    ).classList.add("hidden");

    document.getElementById(
        "qrScreen"
    ).classList.add("hidden");

    document.getElementById(
        "scanScreen"
    ).classList.add("hidden");

    document.getElementById(
        "adminScreen"
    ).classList.remove("hidden");

    updateDashboard();

}



/* =====================================================
   CREATE RECORD
===================================================== */

function createRecord() {

    const customer =
        document.getElementById(
            "customer"
        ).value.trim();


    const telephone =
        document.getElementById(
            "telephone"
        ).value.trim();


    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const address =
        document.getElementById(
            "address"
        ).value.trim();


    const item =
        document.getElementById(
            "item"
        ).value.trim();


    const boxCount =
        parseInt(
            document.getElementById(
                "boxCount"
            ).value,
            10
        );


    const amount =
        document.getElementById(
            "amount"
        ).value;


    const dueDate =
        document.getElementById(
            "dueDate"
        ).value;


    const paymentStatus =
        document.getElementById(
            "paymentStatus"
        ).value;


    const notes =
        document.getElementById(
            "notes"
        ).value.trim();



    if (!customer) {

        alert(
            "Please enter a customer name."
        );

        return;

    }


    if (!item) {

        alert(
            "Please enter the item / contents."
        );

        return;

    }


    if (
        !boxCount ||
        boxCount < 1
    ) {

        alert(
            "Please enter the number of boxes."
        );

        return;

    }



    /*
     * Permanent reference number
     */

    const reference =
        String(
            records.length + 1
        ).padStart(
            4,
            "0"
        );



    /*
     * Unique record ID
     */

    const id =
        (
            window.crypto &&
            crypto.randomUUID
        )
        ?
        crypto.randomUUID()
        :
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2);



    const record = {

        id: id,

        reference: reference,

        customer: customer,

        telephone: telephone,

        email: email,

        address: address,

        item: item,

        boxCount: boxCount,

        amount: amount,

        dueDate: dueDate,

        paymentStatus:
            paymentStatus,

        notes: notes,

        created:
            new Date().toISOString()

    };



    records.push(record);

    saveRecords();

    clearForm();

    updateDashboard();

    showQR(
        record.id,
        1
    );

}



/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm() {

    document.getElementById(
        "customer"
    ).value = "";


    document.getElementById(
        "telephone"
    ).value = "";


    document.getElementById(
        "email"
    ).value = "";


    document.getElementById(
        "address"
    ).value = "";


    document.getElementById(
        "item"
    ).value = "";


    document.getElementById(
        "boxCount"
    ).value = "1";


    document.getElementById(
        "amount"
    ).value = "";


    document.getElementById(
        "dueDate"
    ).value = "";


    document.getElementById(
        "paymentStatus"
    ).value = "Unpaid";


    document.getElementById(
        "notes"
    ).value = "";

}



/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard() {

    document.getElementById(
        "recordCount"
    ).textContent =
        records.length;


    let paid = 0;

    let due = 0;

    let overdue = 0;



    records.forEach(
        record => {

            if (
                record.paymentStatus ===
                "Paid"
            ) {

                paid++;

                return;

            }


            if (!record.dueDate) {

                return;

            }


            const today =
                new Date();

            today.setHours(
                0,
                0,
                0,
                0
            );


            const dueDate =
                new Date(
                    record.dueDate
                );

            dueDate.setHours(
                0,
                0,
                0,
                0
            );


            const difference =
                (
                    dueDate -
                    today
                ) /
                (
                    1000 *
                    60 *
                    60 *
                    24
                );


            if (
                difference < 0
            ) {

                overdue++;

            }
            else if (
                difference <= 7
            ) {

                due++;

            }

        }
    );


    document.getElementById(
        "paidCount"
    ).textContent =
        paid;


    document.getElementById(
        "dueCount"
    ).textContent =
        due;


    document.getElementById(
        "overdueCount"
    ).textContent =
        overdue;


    renderRecords();

}



/* =====================================================
   PAYMENT DISPLAY
===================================================== */

function getPaymentDisplay(
    record
) {

    if (
        record.paymentStatus ===
        "Paid"
    ) {

        return `
            <span style="color:green;font-weight:bold;">
                PAID
            </span>
        `;

    }


    if (!record.dueDate) {

        return `
            <span>
                UNPAID
            </span>
        `;

    }


    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );


    const dueDate =
        new Date(
            record.dueDate
        );

    dueDate.setHours(
        0,
        0,
        0,
        0
    );


    const difference =
        (
            dueDate -
            today
        ) /
        (
            1000 *
            60 *
            60 *
            24
        );


    if (
        difference < 0
    ) {

        return `
            <span style="color:red;font-weight:bold;">
                OVERDUE
            </span>
        `;

    }


    if (
        difference <= 7
    ) {

        return `
            <span style="color:#d68a00;font-weight:bold;">
                DUE SOON
            </span>
        `;

    }


    return `
        <span>
            UNPAID
        </span>
    `;

}



/* =====================================================
   RECORD TABLE
===================================================== */

function renderRecords() {

    const tbody =
        document.getElementById(
            "recordsTable"
        );


    tbody.innerHTML = "";


    records.forEach(
        record => {

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${escapeHTML(
                        record.reference
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        record.customer
                    )}
                </td>

                <td>
                    ${record.boxCount}
                </td>

                <td>
                    ${getPaymentDisplay(
                        record
                    )}
                </td>

                <td>

                    <button
                        class="btn-orange"
                        onclick="showQR(
                            '${record.id}',
                            1
                        )"
                    >
                        QR
                    </button>

                </td>

            `;


            tbody.appendChild(
                row
            );

        }
    );

}



/* =====================================================
   ENCODE QR DATA
===================================================== */

function encodeQRData(
    record,
    boxNumber
) {

    const payload = {

        id:
            record.id,

        reference:
            record.reference,

        customer:
            record.customer,

        telephone:
            record.telephone,

        email:
            record.email,

        address:
            record.address,

        item:
            record.item,

        boxNumber:
            boxNumber,

        boxCount:
            record.boxCount,

        amount:
            record.amount,

        dueDate:
            record.dueDate,

        paymentStatus:
            record.paymentStatus,

        notes:
            record.notes

    };


    const json =
        JSON.stringify(
            payload
        );


    /*
     * Convert UTF-8 safely to Base64
     */

    const bytes =
        new TextEncoder()
            .encode(json);


    let binary = "";

    bytes.forEach(
        byte => {
            binary +=
                String.fromCharCode(
                    byte
                );
        }
    );


    const base64 =
        btoa(binary);


    /*
     * Make Base64 safe for URLs
     */

    return base64
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");

}



/* =====================================================
   DECODE QR DATA
===================================================== */

function decodeQRData(
    encoded
) {

    try {

        let base64 =
            encoded
                .replace(/-/g, "+")
                .replace(/_/g, "/");


        while (
            base64.length % 4
        ) {

            base64 += "=";

        }


        const binary =
            atob(base64);


        const bytes =
            Uint8Array.from(
                binary,
                char =>
                    char.charCodeAt(0)
            );


        const json =
            new TextDecoder()
                .decode(bytes);


        return JSON.parse(
            json
        );

    } catch (error) {

        return null;

    }

}



/* =====================================================
   SHOW QR LABEL
===================================================== */

function showQR(
    id,
    boxNumber
) {

    const record =
        records.find(
            r =>
                r.id === id
        );


    if (!record) {

        alert(
            "Record not found."
        );

        return;

    }

/* =====================================================
   CREATE BOX BUTTONS
===================================================== */

function createBoxButtons(
    record
) {

    const selector =
        document.getElementById(
            "boxSelector"
        );


    selector.innerHTML = "";


    for (
        let i = 1;
        i <= record.boxCount;
        i++
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "btn-grey";


        button.textContent =
            i;


        button.onclick =
            function() {

                showQR(
                    record.id,
                    i
                );

            };


        selector.appendChild(
            button
        );

    }

}



/* =====================================================
   CREATE QR CODE
===================================================== */

function createQRCode(
    record,
    boxNumber
) {

    const preview =
        document.getElementById(
            "qrPreview"
        );


    preview.innerHTML = "";


    const encoded =
        encodeQRData(
            record,
            boxNumber
        );


    const qrURL =
        window.location.origin +
        window.location.pathname +
        "?data=" +
        encoded;


    new QRCode(
        preview,
        {

            text:
                qrURL,

            width:
                250,

            height:
                250,

            correctLevel:
                QRCode.CorrectLevel.H

        }
    );

}



/* =====================================================
   SAVE CURRENT LABEL AS JPEG
===================================================== */

async function saveCurrentLabel() {

    const record =
        records.find(
            r =>
                r.id ===
                currentRecordId
        );


    if (!record) return;


    const qrCanvas =
        document.querySelector(
            "#qrPreview canvas"
        );


    const qrImage =
        document.querySelector(
            "#qrPreview img"
        );


    if (
        !qrCanvas &&
        !qrImage
    ) {

        alert(
            "QR code is not ready yet."
        );

        return;

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        1000;

    canvas.height =
        1200;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /* BACKGROUND */

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        1000,
        1200
    );


    /* BORDER */

    ctx.strokeStyle =
        "#000000";

    ctx.lineWidth =
        8;

    ctx.strokeRect(
        20,
        20,
        960,
        1160
    );


    /* MOOVIT */

    ctx.fillStyle =
        "#000000";

    ctx.textAlign =
        "center";

    ctx.font =
        "bold 70px Arial";

    ctx.fillText(
        "MOOVIT",
        500,
        105
    );


    /* CUSTOMER */

    ctx.textAlign =
        "left";

    ctx.font =
        "bold 38px Arial";

    ctx.fillText(
        "Customer:",
        70,
        190
    );


    ctx.font =
        "38px Arial";

    ctx.fillText(
        record.customer,
        70,
        240
    );


    /* REFERENCE */

    ctx.font =
        "bold 38px Arial";

    ctx.fillText(
        "Reference No.:",
        70,
        320
    );


    ctx.font =
        "38px Arial";

    ctx.fillText(
        record.reference,
        70,
        370
    );


    /* BOX */

    ctx.textAlign =
        "center";

    ctx.font =
        "bold 42px Arial";

    ctx.fillText(
        "BOX " +
        currentBoxNumber +
        " OF " +
        record.boxCount,
        500,
        445
    );


    /* ITEM */

    ctx.textAlign =
        "left";

    ctx.font =
        "bold 36px Arial";

    ctx.fillText(
        "Item / Contents:",
        70,
        510
    );


    ctx.font =
        "32px Arial";


    const words =
        String(
            record.item || ""
        ).split(" ");


    let line = "";

    let y = 555;


    words.forEach(
        word => {

            const test =
                line +
                word +
                " ";


            if (
                ctx.measureText(
                    test
                ).width > 850
            ) {

                ctx.fillText(
                    line,
                    70,
                    y
                );

                line =
                    word +
                    " ";

                y += 42;

            } else {

                line =
                    test;

            }

        }
    );


    if (line) {

        ctx.fillText(
            line,
            70,
            y
        );

    }


    /* QR */

    const qrSize =
        500;


    const qrX =
        250;


    const qrY =
        Math.max(
            590,
            y + 35
        );


    if (qrCanvas) {

        ctx.drawImage(
            qrCanvas,
            qrX,
            qrY,
            qrSize,
            qrSize
        );

    } else {

        ctx.drawImage(
            qrImage,
            qrX,
            qrY,
            qrSize,
            qrSize
        );

    }


    /* FOOTER */

    ctx.textAlign =
        "center";

    ctx.font =
        "bold 34px Arial";

    ctx.fillText(
        "SCAN TO IDENTIFY",
        500,
        1160
    );


    const filename =
        "MOOVIT_" +
        record.reference +
        "_Box_" +
        currentBoxNumber +
        "_of_" +
        record.boxCount +
        ".jpg";


    canvas.toBlob(
        async blob => {

            if (!blob) {

                alert(
                    "Unable to create image."
                );

                return;

            }


            const file =
                new File(
                    [blob],
                    filename,
                    {
                        type:
                            "image/jpeg"
                    }
                );


            /*
             * iPhone / iPad
             */

            if (
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({
                    files:
                        [file]
                })
            ) {

                try {

                    await navigator.share({

                        files:
                            [file],

                        title:
                            "MOOVIT QR Label",

                        text:
                            "MOOVIT QR Label"

                    });

                    return;

                } catch (error) {

                    if (
                        error.name ===
                        "AbortError"
                    ) {

                        return;

                    }

                }

            }


            /*
             * Desktop fallback
             */

            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;

            link.download =
                filename;


            document.body.appendChild(
                link
            );

            link.click();

            document.body.removeChild(
                link
            );


            setTimeout(
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );


        },
        "image/jpeg",
        0.95
    );

}

/* =====================================================
   SHOW SCAN RESULT
===================================================== */

function showScan(
    data
) {

    document.getElementById(
        "loginScreen"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "adminScreen"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "qrScreen"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "scanScreen"
    ).classList.remove(
        "hidden"
    );


    const record =
        data;


    let statusHTML =
        "UNPAID";


    if (
        record.paymentStatus ===
        "Paid"
    ) {

        statusHTML =
            "PAID";

    }
    else if (
        record.dueDate
    ) {

        const today =
            new Date();

        today.setHours(
            0,
            0,
            0,
            0
        );


        const due =
            new Date(
                record.dueDate
            );

        due.setHours(
            0,
            0,
            0,
            0
        );


        const days =
            (
                due -
                today
            ) /
            (
                1000 *
                60 *
                60 *
                24
            );


        if (
            days < 0
        ) {

            statusHTML =
                "OVERDUE";

        }
        else if (
            days <= 7
        ) {

            statusHTML =
                "DUE SOON";

        }

    }



    let statusColour =
        "#eeeeee";


    if (
        statusHTML ===
        "PAID"
    ) {

        statusColour =
            "#d9f2df";

    }
    else if (
        statusHTML ===
        "OVERDUE"
    ) {

        statusColour =
            "#ffd9d9";

    }
    else if (
        statusHTML ===
        "DUE SOON"
    ) {

        statusColour =
            "#fff0c7";

    }



    document.getElementById(
        "scanContent"
    ).innerHTML = `

        <div
            class="scan-status"
            style="
            background:${statusColour};
            "
        >
            ${statusHTML}
        </div>


        <div class="scan-field">

            <strong>
                Reference
            </strong>

            ${escapeHTML(
                record.reference
            )}

        </div>


        <div class="scan-field">

            <strong>
                Customer
            </strong>

            ${escapeHTML(
                record.customer
            )}

        </div>


        <div class="scan-field">

            <strong>
                Box
            </strong>

            ${escapeHTML(
                String(
                    record.boxNumber
                )
            )}

            of

            ${escapeHTML(
                String(
                    record.boxCount
                )
            )}

        </div>


        <div class="scan-field">

            <strong>
                Item / Contents
            </strong>

            ${escapeHTML(
                record.item
            )}

        </div>


        <div class="scan-field">

            <strong>
                Address
            </strong>

            ${escapeHTML(
                record.address
            )}

        </div>


        <div class="scan-field">

            <strong>
                Telephone
            </strong>

            ${escapeHTML(
                record.telephone
            )}

        </div>


        <div class="scan-field">

            <strong>
                Email
            </strong>

            ${escapeHTML(
                record.email
            )}

        </div>


        ${
            record.amount
            ?
            `
            <div class="scan-field">

                <strong>
                    Payment Amount
                </strong>

                €${escapeHTML(
                    record.amount
                )}

            </div>
            `
            :
            ""
        }


        <div class="scan-field">

            <strong>
                Payment Due / Expiry
            </strong>

            ${escapeHTML(
                record.dueDate || ""
            )}

        </div>


        <div class="scan-field">

            <strong>
                Notes
            </strong>

            ${escapeHTML(
                record.notes
            )}

        </div>

    `;

}



/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

function resetDemo() {

    const first =
        confirm(
            "WARNING: This will delete all MOOVIT demo records from this browser. Continue?"

    alert(

    );

}

/*
 * IMPORTANT:
 *
 * The QR now uses ?data=
 * rather than ?id=
 *
 * This means the QR can be scanned
 * on another phone and still display
 * the information.
 */

const params =
    new URLSearchParams(
        window.location.search
    );


const qrData =
    params.get(
        "data"
    );


if (qrData) {

    const decoded =
        decodeQRData(
            qrData
        );


    if (decoded) {

        showScan(
            decoded
        );

    }
    else {

        document.getElementById(
            "loginScreen"
        ).classList.add(
            "hidden"
        );

        document.getElementById(
            "scanScreen"
        ).classList.remove(
            "hidden"
        );

        document.getElementById(
            "scanContent"
        ).innerHTML = `

            <div
                style="
                text-align:center;
                padding:40px;
                "
            >

                <h2>
                    Invalid QR Code
                </h2>

                <p>
                    This QR code could not
                    be read by MOOVIT.
                </p>

            </div>

        `;

    }

}
else if (
    localStorage.getItem(
        "moovitLoggedIn"
    ) === "true"
) {

    showDashboard();

}
else {

    document.getElementById(
        "loginScreen"
    ).classList.remove(
        "hidden"
    );

}
