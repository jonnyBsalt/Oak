<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEMO 0001</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.15);
}

.demo {
    text-align: center;
    color: #c00000;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 10px;
}

.reference {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 25px;
}

h1 {
    text-align: center;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 18px;
    margin-bottom: 6px;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    height: 120px;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    background: #111;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
}

#message {
    text-align: center;
    margin-top: 15px;
    color: green;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

<div class="demo">
DEMO
</div>

<div class="reference">
Reference: 0001
</div>

<h1>Information Form</h1>

<form id="form">

<label>Name</label>
<input type="text" name="name" value="Sample">

<label>Address</label>
<input type="text" name="address" value="Sample">

<label>Item</label>
<input type="text" name="item" value="Sample">

<label>Notes</label>
<textarea name="notes">Sample</textarea>

<button type="submit">
Submit
</button>

<div id="message"></div>

</form>

</div>

<script>

document.getElementById("form").addEventListener("submit", function(event) {

    event.preventDefault();

    document.getElementById("message").textContent =
        "Demo 0001 submitted successfully.";

});

</script>

</body>
</html>
